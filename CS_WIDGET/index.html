<!doctype html>
<html lang="id" class="h-full w-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customer Service — WebStudio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body
    class="h-full w-full overflow-hidden font-['Plus_Jakarta_Sans',sans-serif] flex flex-col bg-[#F9FAFB] text-slate-800"
  >
    <!-- ══════════════════════════════════════════════
         1. TOP NAVBAR / HEADER
    ══════════════════════════════════════════════ -->
    <header
      class="h-16 shrink-0 bg-white/80 backdrop-blur-md border-b border-slate-100 px-6 lg:px-12 flex items-center justify-between z-10"
    >
      <div class="flex items-center gap-3">
        <div class="relative">
          <img
            src="/avatar.png"
            alt="Foto Profil CS WebStudio"
            class="h-10 w-10 rounded-full object-cover shadow-sm ring-2 ring-blue-500/20"
          />
          <span
            class="absolute bottom-0 right-0 w-2.5 h-2.5 rounded-full bg-emerald-500 ring-2 ring-white"
          ></span>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <span class="font-semibold text-sm tracking-tight text-slate-900"
              >WebStudio Assistant</span
            >
            <span
              class="px-2 py-0.5 text-[10px] font-semibold bg-blue-50 text-blue-600 rounded-full border border-blue-100/80"
              >AI Support</span
            >
          </div>
        </div>
      </div>

      <!-- Action buttons -->
      <div class="flex items-center gap-3">
        <button
          id="exitBtn"
          class="flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium text-slate-500 hover:text-slate-800 hover:bg-slate-100 rounded-lg transition"
          title="Keluar"
        >
          <svg
            class="h-4 w-4"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
            />
          </svg>
          <span class="hidden sm:inline">Keluar</span>
        </button>
      </div>
    </header>

    <!-- ══════════════════════════════════════════════
         2. MAIN VIEWPORT (CENTER STAGE)
    ══════════════════════════════════════════════ -->
    <main
      id="chatScroll"
      class="flex-1 overflow-y-auto px-4 md:px-8 py-8 flex flex-col justify-between"
      style="scrollbar-width: thin"
    >
      <div class="max-w-4xl w-full mx-auto flex-1 flex flex-col justify-center">
        <!-- A. STATE AWAL: EMPTY STATE / SUGGESTION CARDS (HERO) -->
        <div id="heroState" class="space-y-10 py-6 transition-all duration-300">
          <!-- Avatar Glowing & Greetings -->
          <div class="text-center space-y-3">
            <!-- avatar profile -->
            <div
              class="relative inline-flex w-16 h-16 rounded-full bg-gradient-to-tr from-sky-400 via-blue-500 to-indigo-600 p-[2.5px] shadow-lg shadow-blue-500/25"
            >
              <img
                src="/avatar.png"
                alt="Foto Profil CS"
                class="w-full h-full rounded-full object-cover bg-white"
              />
              <span
                class="absolute bottom-0 right-0 w-3.5 h-3.5 rounded-full bg-emerald-500 ring-2 ring-white"
              ></span>
            </div>
            <h1
              class="text-2xl md:text-3xl font-bold tracking-tight text-slate-900"
            >
              Hi, there 👋
            </h1>
            <p class="text-sm md:text-base text-slate-500 max-w-md mx-auto">
              Ada yang bisa kami bantu seputar jasa pembuatan dan pengembangan
              website?
            </p>
          </div>

          <!-- 3 Suggestion Cards (Mirip Orbita AI) -->
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <!-- Card 1: Paket & Layanan Web -->
            <button
              data-prompt="Apa saja jenis website yang bisa dibuat dan berapa harganya?"
              class="suggestion-card text-left p-5 rounded-2xl bg-white border border-slate-200/80 shadow-sm hover:shadow-md hover:border-slate-300 hover:-translate-y-1 transition duration-200 flex flex-col justify-between group cursor-pointer"
            >
              <div>
                <div class="flex items-center justify-between mb-3">
                  <span
                    class="inline-flex items-center justify-center p-2 rounded-xl bg-slate-100 text-slate-600 group-hover:bg-blue-50 group-hover:text-blue-600 transition"
                  >
                    💰
                  </span>
                </div>
                <h3
                  class="font-semibold text-sm text-slate-800 group-hover:text-blue-600 transition"
                >
                  Paket & Layanan Web
                </h3>
                <p class="text-xs text-slate-500 mt-1.5 leading-relaxed">
                  Cek opsi Landing Page, Company Profile, hingga Toko Online
                  beserta estimasi biaya.
                </p>
              </div>
              <div
                class="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between text-[11px] text-slate-400 font-medium"
              >
                <span>Tanyakan paket</span>
                <span class="group-hover:translate-x-1 transition">→</span>
              </div>
            </button>

            <!-- Card 2: Estimasi Waktu -->
            <button
              data-prompt="Berapa lama proses pengerjaan pembuatan website dan bagaimana ketentuan revisinya?"
              class="suggestion-card text-left p-5 rounded-2xl bg-white border border-slate-200/80 shadow-sm hover:shadow-md hover:border-slate-300 hover:-translate-y-1 transition duration-200 flex flex-col justify-between group"
            >
              <div>
                <div class="flex items-center justify-between mb-3">
                  <span
                    class="inline-flex items-center justify-center p-2 rounded-xl bg-slate-100 text-slate-600 group-hover:bg-blue-50 group-hover:text-blue-600 transition"
                  >
                    ⏱️
                  </span>
                </div>
                <h3
                  class="font-semibold text-sm text-slate-800 group-hover:text-blue-600 transition"
                >
                  Estimasi Waktu & Revisi
                </h3>
                <p class="text-xs text-slate-500 mt-1.5 leading-relaxed">
                  Berapa hari proyek selesai dikerjakan dan berapa kali
                  kesempatan revisi desain.
                </p>
              </div>
              <div
                class="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between text-[11px] text-slate-400 font-medium"
              >
                <span>Lihat durasi</span>
                <span class="group-hover:translate-x-1 transition">→</span>
              </div>
            </button>

            <!-- Card 3: Cara Pemesanan -->
            <button
              data-prompt="Bagaimana alur dan syarat pemesanan website di WebStudio?"
              class="suggestion-card text-left p-5 rounded-2xl bg-white border border-slate-200/80 shadow-sm hover:shadow-md hover:border-slate-300 hover:-translate-y-1 transition duration-200 flex flex-col justify-between group"
            >
              <div>
                <div class="flex items-center justify-between mb-3">
                  <span
                    class="inline-flex items-center justify-center p-2 rounded-xl bg-slate-100 text-slate-600 group-hover:bg-blue-50 group-hover:text-blue-600 transition"
                  >
                    📋
                  </span>
                </div>
                <h3
                  class="font-semibold text-sm text-slate-800 group-hover:text-blue-600 transition"
                >
                  Alur & Syarat Order
                </h3>
                <p class="text-xs text-slate-500 mt-1.5 leading-relaxed">
                  Langkah konsultasi materi, pembayaran DP, hingga website siap
                  dirilis ke publik.
                </p>
              </div>
              <div
                class="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between text-[11px] text-slate-400 font-medium"
              >
                <span>Pelajari alur</span>
                <span class="group-hover:translate-x-1 transition">→</span>
              </div>
            </button>
          </div>

          <!-- Action Chips / Pill Tags -->
          <div class="flex flex-wrap items-center justify-center gap-2 pt-2">
            <button
              data-prompt="Berapa harga paket website landing page?"
              class="chip-action px-3.5 py-1.5 rounded-full bg-white border border-slate-200 text-xs font-medium text-slate-600 hover:bg-slate-50 hover:border-slate-300 transition shadow-2xs"
            >
              harga landing page
            </button>

            <button
              data-prompt="Apa saja yang termasuk dalam paket website?"
              class="chip-action px-3.5 py-1.5 rounded-full bg-white border border-slate-200 text-xs font-medium text-slate-600 hover:bg-slate-50 hover:border-slate-300 transition shadow-2xs"
            >
              Isi Paket
            </button>

            <button
              data-prompt="Bagaimana cara menghubungi admin langsung via WhatsApp?"
              class="chip-action px-3.5 py-1.5 rounded-full bg-white border border-slate-200 text-xs font-medium text-slate-600 hover:bg-slate-50 hover:border-slate-300 transition shadow-2xs"
            >
              Kontak WhatsApp
            </button>
          </div>
        </div>

        <!-- B. STATE PERCAKAPAN (BUBBLE MESSAGES LIST) -->
        <div id="chatState" class="hidden space-y-4 py-4">
          <div id="messagesList" class="space-y-4"></div>
        </div>
      </div>
    </main>

    <!-- ══════════════════════════════════════════════
         3. BOTTOM FLOATING CHAT INPUT BAR
    ══════════════════════════════════════════════ -->
    <footer class="shrink-0 bg-transparent px-4 md:px-8 pb-6 pt-2">
      <div class="max-w-4xl mx-auto">
        <form
          id="chatForm"
          class="relative bg-white rounded-2xl border border-slate-200 shadow-lg shadow-slate-100 p-2.5 transition-all focus-within:border-blue-400 focus-within:ring-4 focus-within:ring-blue-50"
        >
          <!-- Input Textfield -->
          <div class="px-2 pt-1 pb-2">
            <textarea
              id="messageInput"
              rows="1"
              placeholder="Tanyakan apapun seputar pembuatan website..."
              class="w-full resize-none bg-transparent text-sm text-slate-800 placeholder-slate-400 outline-none max-h-32 leading-relaxed"
            ></textarea>
          </div>

          <!-- Buttons (Send) -->
          <div class="flex items-center justify-end gap-2">
            <button
              id="sendBtn"
              type="submit"
              class="inline-flex items-center gap-1.5 px-4 py-1.5 rounded-xl bg-slate-900 hover:bg-blue-600 text-white text-xs font-medium shadow-sm transition active:scale-95 disabled:opacity-40 disabled:hover:bg-slate-900 disabled:cursor-not-allowed"
            >
              <span>Kirim</span>
              <svg
                class="w-3.5 h-3.5"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M14 5l7 7m0 0l-7 7m7-7H3"
                />
              </svg>
            </button>
          </div>
        </form>

        <p class="text-center text-[11px] text-slate-400 mt-2.5">
          CS AI memberikan jawaban berdasarkan data layanan WebStudio. Untuk
          negosiasi khusus, hubungi WhatsApp kami.
        </p>
      </div>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
